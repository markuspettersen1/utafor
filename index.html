<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEFF1">
<title>Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   Palette: cold Nordic daylight. Blue = aerobic, red = quality.
   Intensity colour is information, not decoration.
   ============================================================ */
:root{
  --paper:#EDEFF1;
  --card:#F179;            /* overwritten below, kept for grep */
  --card:#F8F9FA;
  --ink:#14181C;
  --ink-2:#5B656F;
  --ink-3:#8B959E;
  --rule:#CFD5DA;
  --cold:#1F5673;          /* easy / aerobic */
  --cold-soft:#D7E3EA;
  --hot:#D8412F;           /* quality / threshold+ */
  --hot-soft:#F6DCD7;
  --iron:#4A4E55;          /* strength */
  --iron-soft:#DEE0E3;
  --snow:#3E7D8C;          /* ski */
  --snow-soft:#D5E6E9;
  --ok:#2E7D5B;
  --warn:#B7791F;
  --r:10px;
  --pad:16px;
  --display:'Archivo',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--display);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
.wrap{max-width:560px;margin:0 auto;padding:0 var(--pad)}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-0.02em}
h1{font-size:26px}
h2{font-size:17px}
h3{font-size:14px}
p{margin:0 0 10px}
button{font-family:inherit;font-size:14px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px} /* 16px stops iOS zoom */
a{color:var(--cold)}

/* header */
header{
  position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--rule);
  padding-top:calc(10px + env(safe-area-inset-top));
}
.head{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:10px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* cards */
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:14px;margin:12px 0}
.card.tight{padding:12px}
.row{display:flex;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* type utilities */
.mono{font-family:var(--mono)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.big{font-size:30px;letter-spacing:-0.03em;line-height:1.05}
.mut{color:var(--ink-2)}
.small{font-size:12.5px}
.tiny{font-size:11px}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.hr{height:1px;background:var(--rule);margin:12px 0;border:0}

/* buttons */
.btn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn.sm{padding:7px 10px;font-size:13px}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45}

/* form */
label.f{display:block;margin:10px 0}
label.f span{display:block;margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;padding:9px 10px;border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink)
}
textarea{min-height:80px;resize:vertical}

/* ============================================================
   SIGNATURE: the week strip.
   Bar height = duration. Fill = intensity. Dashed rule = the Limit,
   i.e. the weekly hour ceiling spread across the days you train.
   ============================================================ */
.strip{position:relative;padding:6px 0 0}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;background:none;border:0;padding:0;text-align:center}
.bar .fill{border-radius:4px 4px 0 0;width:100%;transition:height .25s ease;border:1px solid rgba(0,0,0,.08)}
.bar.today .fill{outline:2px solid var(--ink);outline-offset:1px}
.i-easy{background:var(--cold-soft);border-color:var(--cold)!important}
.i-quality{background:var(--hot-soft);border-color:var(--hot)!important}
.i-long{background:var(--cold);}
.i-strength{background:var(--iron-soft);border-color:var(--iron)!important}
.i-ski{background:var(--snow-soft);border-color:var(--snow)!important}
.i-rest{background:repeating-linear-gradient(45deg,transparent,transparent 3px,var(--rule) 3px,var(--rule) 4px);border-color:var(--rule)!important}
.limit{position:absolute;left:0;right:0;border-top:1px dashed var(--ink-3)}
.limit span{position:absolute;right:0;top:-14px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;background:var(--card);padding:0 3px}
.days{display:flex;gap:6px;margin-top:6px}
.days div{flex:1;text-align:center;font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.06em}
.days div.today{color:var(--hot);font-weight:600}

/* session list */
.sess{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--rule);align-items:flex-start;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.sess:last-child{border-bottom:0}
.tick{width:4px;align-self:stretch;border-radius:2px;flex:0 0 4px;min-height:34px}
.t-easy{background:var(--cold)}.t-quality{background:var(--hot)}.t-long{background:var(--cold)}
.t-strength{background:var(--iron)}.t-ski{background:var(--snow)}.t-rest{background:var(--rule)}
.sess .meta{margin-left:auto;text-align:right;flex:0 0 auto}
.done{opacity:.5}
.done .name{text-decoration:line-through}

/* chips */
.chip{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 7px;border-radius:99px;border:1px solid var(--rule);color:var(--ink-2);background:#fff}
.chip.hot{border-color:var(--hot);color:var(--hot)}
.chip.cold{border-color:var(--cold);color:var(--cold)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.warn{border-color:var(--warn);color:var(--warn)}

/* tabs */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(237,239,241,.94);
  backdrop-filter:blur(8px);border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom)}
.tabs{max-width:560px;margin:0 auto;display:flex}
.tabs button{flex:1;background:none;border:0;padding:11px 4px 12px;color:var(--ink-3);
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.tabs button.on{color:var(--ink)}
.tabs button.on .dot{opacity:1}
.dot{display:block;width:16px;height:2px;background:var(--hot);margin:0 auto 6px;opacity:0;border-radius:2px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(20,24,28,.4);z-index:40;display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);
  border-radius:16px 16px 0 0;max-height:88vh;overflow:auto;transform:translateY(100%);
  transition:transform .22s ease;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.sheet.open{transform:translateY(0)}
.sheet .inner{max-width:560px;margin:0 auto;padding:18px var(--pad)}
.grab{width:36px;height:4px;background:var(--rule);border-radius:2px;margin:9px auto 0}

/* misc */
.metric{padding:12px 0;border-bottom:1px solid var(--rule)}
.metric:last-child{border-bottom:0}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:6px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:400}
td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:26px 10px;color:var(--ink-2)}
.msg{padding:9px 11px;border-radius:10px;margin:8px 0;font-size:14px;white-space:pre-wrap}
.msg.me{background:var(--ink);color:#fff;margin-left:38px}
.msg.ai{background:#fff;border:1px solid var(--rule);margin-right:14px}
.seg{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:#fff;border:0;padding:8px 4px;font-size:13px;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
</style>
</head>
<body>

<header>
  <div class="wrap head">
    <div>
      <div class="eyebrow" id="hdrPhase">—</div>
      <h1 id="hdrTitle">Coach</h1>
    </div>
    <div style="text-align:right">
      <div class="eyebrow">to race</div>
      <div class="num" style="font-size:20px" id="hdrDays">—</div>
    </div>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav>
  <div class="tabs" id="tabs">
    <button data-tab="week" class="on"><span class="dot"></span>Week</button>
    <button data-tab="metrics"><span class="dot"></span>Metrics</button>
    <button data-tab="log"><span class="dot"></span>Log</button>
    <button data-tab="ask"><span class="dot"></span>Ask</button>
    <button data-tab="you"><span class="dot"></span>You</button>
  </div>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="inner" id="sheetIn"></div></div>

<script>
/* ==================================================================
   ENDURANCE COACH  —  single file, no build step, no dependencies.
   Everything is plain JS so you can open this file and change it.

   Sections, in order:
     1. Storage        6. Weather + readiness
     2. Profile        7. Plan generator      <- the interesting one
     3. Parsing        8. Views
     4. Physiology     9. Ask / Claude
     5. Load stats    10. Boot
   ================================================================== */

/* ---------- 1. STORAGE ------------------------------------------ */
/* localStorage where available, memory otherwise, so this also runs
   inside preview sandboxes that block storage. */
const DB = {
  mem:{},
  get(k,d=null){
    try{const v=localStorage.getItem(k); if(v!==null) return JSON.parse(v);}catch(e){}
    return (k in this.mem)?this.mem[k]:d;
  },
  set(k,v){ this.mem[k]=v; try{localStorage.setItem(k,JSON.stringify(v))}catch(e){} }
};

const DEFAULTS = {
  profile:{
    name:'',
    // ---- CHANGE THESE. Seeded from the Garmin export you gave me. ----
    raceName:'Half marathon',
    raceDate:'2027-03-21',        // placeholder — set the real one
    raceDist:21097,               // metres
    goalTime:5400,                // 1:30:00 in seconds
    weeklyHours:7.5,
    maxHR:190,
    restHR:45,
    weightKg:75,
    lat:57.048, lon:9.921,        // Aalborg — change on the You tab
    place:'Aalborg',
    restDay:1,                    // 1 = Monday
    qualityDay:2,                 // 2 = Tuesday
    strengthDays:[3,6],           // Wed + Sat
    winterMode:'auto',            // auto | on | off
    skiDays:[5],                  // Friday double poling when winter is on
    prs:[
      {dist:42195,time:11539,date:'2026-04-26',label:'Hamburg marathon'} // 3:12:19
    ],
    lifts:{squat:null,deadlift:null,bench:null,pullup:null}
  },
  activities:[], strength:[], checkins:[], debriefs:[], doneSessions:{}, weekNotes:{}
};

let S = {
  profile: {...DEFAULTS.profile, ...(DB.get('profile')||{})},
  activities: DB.get('activities', []),
  strength:   DB.get('strength', []),
  checkins:   DB.get('checkins', []),
  debriefs:   DB.get('debriefs', []),
  doneSessions: DB.get('doneSessions', {}),
};
function save(k){ DB.set(k, S[k]); }
function saveAll(){ ['profile','activities','strength','checkins','debriefs','doneSessions'].forEach(save); }

/* ---------- 2. PROFILE HELPERS ---------------------------------- */
const DAYNAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYLETTER=['S','M','T','W','T','F','S'];

const today = ()=> new Date(new Date().toDateString());
const iso = d => new Date(d).toISOString().slice(0,10);
function daysTo(dstr){ return Math.round((new Date(dstr) - today())/86400000); }
function mondayOf(d){ const x=new Date(d); const off=(x.getDay()+6)%7; x.setDate(x.getDate()-off); return new Date(x.toDateString()); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function isWinter(d=new Date()){
  if(S.profile.winterMode==='on') return true;
  if(S.profile.winterMode==='off') return false;
  const m=d.getMonth(); return m>=10 || m<=2;   // Nov–Mar
}
function phaseFor(weeksOut){
  if(weeksOut===null) return {key:'base',label:'Base'};
  if(weeksOut<=1)  return {key:'taper',label:'Taper'};
  if(weeksOut<=4)  return {key:'peak', label:'Race specific'};
  if(weeksOut<=12) return {key:'build',label:'Build'};
  return {key:'base',label:'Base'};
}

/* ---------- 3. PARSING ------------------------------------------ */
/* Garmin CSV export. Handles the Norwegian export (comma decimals,
   dot thousands) and the English one. */
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  text = text.replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    } else if(c==='"'){ q=true; }
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if(c!=='\r'){ cell+=c; }
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  const head=rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.length>1).map(r=>{ const o={}; head.forEach((h,i)=>o[h]=(r[i]??'').trim()); return o; });
}
function numNordic(s){
  if(!s||s==='--') return null;
  s = String(s).replace(/\s/g,'');
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');  // 1.234,5 -> 1234.5
  const v = parseFloat(s); return isNaN(v)?null:v;
}
function hmsToSec(s){
  if(!s||s==='--') return null;
  const p = s.replace(',','.').split(':').map(parseFloat);
  if(p.some(isNaN)) return null;
  if(p.length===3) return p[0]*3600+p[1]*60+p[2];
  if(p.length===2) return p[0]*60+p[1];
  return p[0];
}
const SPORTMAP = {
  'løping':'run','lã¸ping':'run','running':'run','trail running':'run','treadmill running':'run',
  'sykling':'bike','cycling':'bike','indoor cycling':'bike',
  'basseng':'swim','pool swim':'swim','svømming':'swim','open water swimming':'swim',
  'langrenn':'ski','classic skiing':'ski','skate skiing':'ski','backcountry skiing':'ski','cross country skiing':'ski','rulleski':'ski','roller skiing':'ski',
  'styrketrening':'strength','strength training':'strength','styrke':'strength',
  'gange':'walk','walking':'walk','fjelltur':'hike','hiking':'hike','vandring':'hike'
};
function importGarmin(text){
  const rows=parseCSV(text);
  const col=(r,...names)=>{ for(const n of names){ if(r[n]!==undefined) return r[n]; } return ''; };
  let added=0;
  const seen = new Set(S.activities.map(a=>a.id));
  rows.forEach(r=>{
    const type=(col(r,'Aktivitetstype','Activity Type')||'').toLowerCase();
    const date=col(r,'Dato','Date');
    if(!date) return;
    const dur=hmsToSec(col(r,'Tid','Time','Medgått tid','Elapsed Time'));
    if(!dur) return;
    const id = date+'|'+type+'|'+Math.round(dur);
    if(seen.has(id)) return;
    let dist = numNordic(col(r,'Distanse','Distance'));           // km for run/bike, m for pool
    const sport = SPORTMAP[type] || 'other';
    if(sport==='swim' && dist && dist>100) dist = dist/1000;      // pool exports metres
    S.activities.push({
      id, sport, raw:type,
      date: date.slice(0,10),
      start: date,
      title: col(r,'Tittel','Title'),
      km: dist,
      sec: dur,
      hrAvg: numNordic(col(r,'Gjennomsnittlig puls','Avg HR')),
      hrMax: numNordic(col(r,'Makspuls','Max HR')),
      elev: numNordic(col(r,'Total stigning','Total Ascent')),
      kcal: numNordic(col(r,'Totale kalorier','Calories')),
      src:'garmin'
    });
    seen.add(id); added++;
  });
  S.activities.sort((a,b)=> b.date.localeCompare(a.date));
  save('activities');
  return added;
}

/* ---------- 4. PHYSIOLOGY --------------------------------------- */
/* Daniels/Gilbert VDOT. VDOT tracks VO2max closely for trained
   runners; it is a performance model, not a lab measurement. */
function vo2AtVel(v){ return -4.60 + 0.182258*v + 0.000104*v*v; }        // v m/min
function velAtVO2(vo2){
  const a=0.000104,b=0.182258,c=-4.60-vo2;
  return (-b + Math.sqrt(b*b - 4*a*c))/(2*a);
}
function pctMaxFor(tMin){
  return 0.8 + 0.1894393*Math.exp(-0.012778*tMin) + 0.2989558*Math.exp(-0.1932605*tMin);
}
function vdotFromRace(distM, sec){
  if(!distM||!sec) return null;
  const v = distM/(sec/60);
  return vo2AtVel(v)/pctMaxFor(sec/60);
}
function timeForDist(vdot, distM){
  let lo=distM/400*60, hi=distM/60*60;   // 400 m/min .. 60 m/min
  for(let i=0;i<60;i++){
    const mid=(lo+hi)/2;
    (vdotFromRace(distM,mid) > vdot) ? (lo=mid) : (hi=mid);
  }
  return (lo+hi)/2;
}
function paceAtPct(vdot, pct){          // returns sec per km
  const v = velAtVO2(vdot*pct);
  return 1000/v*60;
}
function fmtTime(sec){
  if(sec==null||isNaN(sec)) return '—';
  sec=Math.round(sec);
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
           : `${m}:${String(s).padStart(2,'0')}`;
}
function fmtPace(sec){
  if(sec==null||isNaN(sec)) return '—';
  const m=Math.floor(sec/60), s=Math.round(sec%60);
  return `${m}:${String(s).padStart(2,'0')}`;
}
/* Best current VDOT: from PRs and from hard efforts in the log,
   decayed so a marathon from 10 months ago doesn't outrank last week. */
function vdotCandidates(){
  const out=[];
  (S.profile.prs||[]).forEach(p=>{
    const v=vdotFromRace(p.dist,p.time);
    if(v) out.push({v,date:p.date,label:p.label||'PR',dist:p.dist,time:p.time});
  });
  S.activities.filter(a=>a.sport==='run' && a.km>=3 && a.sec>600).forEach(a=>{
    const v=vdotFromRace(a.km*1000,a.sec);
    if(!v || v<25) return;
    // A training run is not a race. VDOT computed from a submaximal effort is a
    // floor, so discount it by how far the average HR sat below race effort (~88% max).
    let effortPenalty;
    if(a.hrAvg && S.profile.maxHR){
      const ratio=a.hrAvg/S.profile.maxHR;
      effortPenalty = Math.max(0, Math.min(8, (0.88-ratio)*100*0.6));
    } else {
      effortPenalty = 3;                       // no HR data, assume it was not all out
    }
    out.push({v,date:a.date,label:a.title||'Run',dist:a.km*1000,time:a.sec,effortPenalty});
  });
  return out.sort((a,b)=>b.v-a.v);
}
function currentVDOT(){
  const c=vdotCandidates();
  if(!c.length) return null;
  const now=today();
  let best=null;
  c.forEach(x=>{
    const ageD=Math.max(0,(now-new Date(x.date))/86400000);
    // fitness decays ~0.35 VDOT/month from the date of the effort, floored at -6
    const adj = x.v - Math.min(6, ageD/30*0.35) - (x.effortPenalty||0);
    if(!best || adj>best.adj) best={...x, adj};
  });
  return best;
}
function paces(vdot){
  return {
    easy:      [paceAtPct(vdot,0.68), paceAtPct(vdot,0.74)],
    marathon:  paceAtPct(vdot,0.84),
    threshold: paceAtPct(vdot,0.88),
    interval:  paceAtPct(vdot,0.975),
    rep:       paceAtPct(vdot,1.06)
  };
}
function e1RM(kg,reps){ return kg*(1+reps/30); }   // Epley
function bestLift(name){
  const sets=S.strength.filter(s=>s.lift===name);
  if(!sets.length) return null;
  let best=null;
  sets.forEach(s=>{
    const e=e1RM(s.kg,s.reps);
    if(!best||e>best.e) best={e,...s};
  });
  return best;
}

/* ---------- 5. LOAD STATS --------------------------------------- */
function weekKey(d){ return iso(mondayOf(d)); }
function weekStats(mon){
  const sun=addDays(mon,7);
  const acts=S.activities.filter(a=>{const d=new Date(a.date);return d>=mon&&d<sun;});
  const str=S.strength.filter(s=>{const d=new Date(s.date);return d>=mon&&d<sun;});
  const strSessions=[...new Set(str.map(s=>s.date))];
  return {
    week:iso(mon),
    hours: acts.reduce((t,a)=>t+a.sec/3600,0) + strSessions.length*0.75,
    sessions: acts.length + strSessions.length,
    km: acts.filter(a=>a.sport==='run').reduce((t,a)=>t+(a.km||0),0)
  };
}
function hoursByWeek(n=8){
  const out=[];
  for(let i=n-1;i>=0;i--) out.push(weekStats(mondayOf(addDays(today(),-7*i))));
  return out;
}
function acuteChronic(){
  const w=hoursByWeek(5);
  const acute=w[4].hours;
  const chronic=w.slice(0,4).reduce((t,x)=>t+x.hours,0)/4;
  return chronic>0 ? acute/chronic : null;
}

let WX=null;
async function loadWeather(){
  const {lat,lon}=S.profile;
  if(lat==null||lon==null) return null;
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`+
      `&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max,snowfall_sum`+
      `&current=temperature_2m,wind_speed_10m,precipitation&timezone=auto&forecast_days=7`;
    const r=await fetch(u);
    if(!r.ok) throw 0;
    WX=await r.json();
    return WX;
  }catch(e){ WX=null; return null; }
}
function wxForDate(dstr){
  if(!WX||!WX.daily) return null;
  const i=WX.daily.time.indexOf(dstr);
  if(i<0) return null;
  return {
    tmax:WX.daily.temperature_2m_max[i], tmin:WX.daily.temperature_2m_min[i],
    rain:WX.daily.precipitation_sum[i], wind:WX.daily.wind_speed_10m_max[i],
    snow:WX.daily.snowfall_sum[i]
  };
}
/* Deterministic rules, written out so you can argue with each line. */
function weatherAdvice(w, sess){
  if(!w) return [];
  const out=[];
  const windMs = w.wind/3.6;
  if(w.tmax>22 && sess.intensity==='quality') out.push(`Warm (${Math.round(w.tmax)}°C). Add 3–5 s/km to interval targets or move it to the evening.`);
  if(w.tmin<-8) out.push(`Cold (${Math.round(w.tmin)}°C). Longer warm-up; hard reps risk airway irritation below −12°C.`);
  if(windMs>9) out.push(`Wind ${Math.round(windMs)} m/s. Run intervals by effort, not pace, and pick a sheltered loop.`);
  if(w.rain>10) out.push(`${Math.round(w.rain)} mm rain. Fine for easy work, worth moving the long run if it's cold with it.`);
  if(w.snow>2 && sess.type!=='ski') out.push(`${w.snow.toFixed(0)} cm snow. Good day to swap this for double poling.`);
  return out;
}
function readinessFrom(c){
  if(!c) return null;
  const sleepPts = c.sleepH>=7.5?5 : c.sleepH>=6.5?4 : c.sleepH>=5.5?2 : 1;
  const score = sleepPts + c.sleepQ + (6-c.stress) + (6-c.soreness);   // 4..20
  if(score>=15) return {score,band:'green',verb:'Train as planned'};
  if(score>=11) return {score,band:'amber',verb:'Keep the intensity, cut the volume'};
  return {score,band:'red',verb:'Easy or rest'};
}
function adaptSession(sess, ready){
  if(!ready || sess.intensity==='rest') return sess;
  const s={...sess, adapted:null};
  if(ready.band==='amber'){
    if(s.intensity==='quality'){ s.adapted='Drop one rep block. Same paces — the point is intensity, not volume.'; s.minutes=Math.round(s.minutes*0.85/5)*5; }
    else if(s.intensity==='long'){ s.adapted='Cut 20 minutes and skip any pace segments.'; s.minutes=Math.max(40,s.minutes-20); }
    else { s.adapted='Keep it genuinely easy.'; }
  }
  if(ready.band==='red'){
    if(s.intensity==='quality'||s.intensity==='long'){
      s.adapted='Swap for 40 min easy, or rest. Move the session to tomorrow if you can.';
      s.minutes=40; s.intensity='easy'; s.type='easy'; s.name='Easy (downgraded)';
    } else { s.adapted='Rest is the better session today.'; }
  }
  return s;
}

function buildWeek(monday){
  const p=S.profile;
  const winter=isWinter(monday);
  // Relative to the week being built, not real-time "today" — otherwise every
  // week you navigate to shows today's phase instead of its own.
  const weeksOut = p.raceDate ? Math.floor((new Date(p.raceDate)-new Date(monday))/(7*86400000)) : null;
  const phase = phaseFor(weeksOut);
  const weekIdx = Math.floor(new Date(monday)/604800000);   // stable rotation seed

  const q = QUALITY[phase.key][weekIdx % QUALITY[phase.key].length];
  const q2 = QUALITY2[phase.key];
  const q2day = (p.qualityDay+2)%7;      // two days after the main quality session
  const lng = LONG[phase.key];
  const st = STRENGTH[phase.key];

  const days=[];
  for(let i=0;i<7;i++){
    const d=addDays(monday,i), dow=d.getDay();
    let s={date:iso(d), dow, name:'Easy run', type:'easy', intensity:'easy',
           minutes:50, body:['Easy pace throughout','Nose-breathing test: if you cannot, slow down']};

    if(dow===p.restDay){
      s={...s, name:'Rest', type:'rest', intensity:'rest', minutes:0,
         body:['Nothing. Two full rest days a week is what makes the other five work.']};
    } else if(dow===p.qualityDay){
      s={...s, name:q.name, type:'quality', intensity:'quality', minutes:q.mins, body:q.body, focus:q.focus};
    } else if(q2 && dow===q2day && dow!==p.restDay && dow!==0){
      s={...s, name:q2.name, type:'quality2', intensity:'quality', minutes:q2.mins, body:q2.body, focus:q2.focus};
    } else if(dow===0 || (dow===6 && p.qualityDay!==6)){
      // long run on Sunday by default
      if(dow===0) s={...s, name:'Long run', type:'long', intensity:'long', minutes:lng.mins, body:[lng.note,'Fuel from 60 min onward']};
    }

    if(winter && (p.skiDays||[]).includes(dow) && s.intensity!=='quality' && s.intensity!=='rest'){
      s={...s, name:SKI.name, type:'ski', intensity:'ski', minutes:SKI.mins, body:SKI[phase.key]};
    }

    const extras=[];
    if((p.strengthDays||[]).includes(dow)){
      extras.push({date:iso(d), dow, name:st.name, type:'strength', intensity:'strength', minutes:st.mins, body:st.body});
    }
    days.push({main:s, extras});
  }

  // Scale to the weekly hour target, protecting quality and strength.
  // Volume, not intensity, is what comes down in a taper.
  const PHASE_VOL={base:1, build:1, peak:0.95, taper:0.55};
  const target=p.weeklyHours*60*PHASE_VOL[phase.key];
  let flex=0, fixed=0;
  days.forEach(d=>{
    [d.main,...d.extras].forEach(s=>{
      if(s.intensity==='quality'||s.intensity==='strength'||s.intensity==='rest') fixed+=s.minutes;
      else flex+=s.minutes;
    });
  });
  const factor = flex>0 ? Math.max(0.45, Math.min(1.3, (target-fixed)/flex)) : 1;
  days.forEach(d=>{
    [d.main,...d.extras].forEach(s=>{
      if(!(s.intensity==='quality'||s.intensity==='strength'||s.intensity==='rest')){
        const floor = s.intensity==='long' ? 45 : 25;
        s.minutes = Math.max(floor, Math.round(s.minutes*factor/5)*5);
      }
    });
  });

  return {monday:iso(monday), phase, weeksOut, winter, days};
}
function allSessions(week){
  return week.days.flatMap(d=>[d.main,...d.extras]).filter(s=>s.minutes>0 || s.intensity==='rest');
}
function sessionKey(s){ return s.date+'|'+s.name; }

function openSheet(html){

function sheetSession(key){
  const date=key.split('|')[0];
  const week=buildWeek(mondayOf(date));
  const s=allSessions(week).find(x=>sessionKey(x)===key);
  if(!s) return;
  const best=currentVDOT(); const p=best?paces(best.adj):null;
  const wx=wxForDate(s.date);
  const done=!!S.doneSessions[key];
  openSheet(`
    <div class="lab">${DAYNAMES[s.dow]} ${s.date}</div>
    <h1 style="margin:4px 0 2px">${esc(s.name)}</h1>
    <div class="row" style="gap:6px;margin:8px 0 14px">
      <span class="chip ${s.intensity==='quality'?'hot':'cold'}">${s.intensity}</span>
      ${s.focus?`<span class="chip">${esc(s.focus)}</span>`:''}
      <span class="chip">${s.minutes} min</span>
    </div>
    <div class="card">${s.body.map(b=>`<div style="padding:5px 0;border-bottom:1px solid var(--rule)">${esc(b)}</div>`).join('')}</div>
    ${p&&(s.intensity==='quality'||s.intensity==='long')?(()=>{
      // Long runs are steady/marathon-pace work, never threshold or interval —
      // those rows only belong on quality days.
      const rows=[`<tr><td>Easy${s.intensity==='long'?'':' / warm-up'}</td><td class="n">${fmtPace(p.easy[1])}–${fmtPace(p.easy[0])}</td></tr>`];
      if(s.intensity==='quality'){
        rows.push(`<tr><td>Threshold</td><td class="n">${fmtPace(p.threshold)}</td></tr>`);
        rows.push(`<tr><td>Interval</td><td class="n">${fmtPace(p.interval)}</td></tr>`);
      } else {
        rows.push(`<tr><td>Marathon</td><td class="n">${fmtPace(p.marathon)}</td></tr>`);
      }
      rows.push(`<tr><td>Goal HM</td><td class="n">${fmtPace(S.profile.goalTime/(S.profile.raceDist/1000))}</td></tr>`);
      return `<div class="card"><h3>Paces today</h3><table><tbody>${rows.join('')}</tbody></table></div>`;
    })():''}
    ${weatherAdvice(wx,s).length?`<div class="card"><h3>Conditions</h3>${weatherAdvice(wx,s).map(a=>`<div class="small" style="padding:4px 0">· ${esc(a)}</div>`).join('')}</div>`:''}
    <div class="grid2" style="margin-top:12px">
      <button class="btn" id="sDone">${done?'Mark not done':'Mark done'}</button>
      <button class="btn ghost" id="sDebrief">Debrief</button>
    </div>
    <button class="btn ghost" id="sClose" style="width:100%;margin-top:10px">Close</button>
  `);
  el('sDone').onclick=()=>{ if(done) delete S.doneSessions[key]; else S.doneSessions[key]={at:new Date().toISOString()}; save('doneSessions'); closeSheet(); render(); };
  el('sDebrief').onclick=()=>sheetDebrief(s);
  el('sClose').onclick=closeSheet;
}

function scale(id,label,v){
  return `<div class="f"><span class="lab">${label}</span><div class="seg" data-scale="${id}">
    ${[1,2,3,4,5].map(n=>`<button type="button" data-v="${n}" class="${n===v?'on':''}">${n}</button>`).join('')}</div></div>`;
}
function wireScales(){
  document.querySelectorAll('[data-scale]').forEach(g=>{
    g.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      g.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    });
  });
}

  const p=S.profile;
  const pc=best?paces(best.adj):null;
  return `You are my endurance coach. Be direct, argue back, and say when the data does not support a conclusion.

ATHLETE
Goal race: ${p.raceName} on ${p.raceDate} (${daysTo(p.raceDate)} days), goal ${fmtTime(p.goalTime)}.
Other goals: general strength on the base lifts; cross-country double poling through winter.
Weekly target: ${p.weeklyHours} h. Rest day ${DAYNAMES[p.restDay]}, quality day ${DAYNAMES[p.qualityDay]}.
Max HR ${p.maxHR}, resting ${p.restHR}, ${p.weightKg} kg, based in ${p.place}.
Records: ${(p.prs||[]).map(r=>`${(r.dist/1000).toFixed(1)}km ${fmtTime(r.time)} (${r.date})`).join('; ')||'none'}

FITNESS
VDOT ${best?best.adj.toFixed(1):'unknown'} from ${best?best.label+' '+best.date:'—'}.
${pc?`Paces /km: easy ${fmtPace(pc.easy[1])}–${fmtPace(pc.easy[0])}, marathon ${fmtPace(pc.marathon)}, threshold ${fmtPace(pc.threshold)}, interval ${fmtPace(pc.interval)}.`:''}
Predicted: 10k ${best?fmtTime(timeForDist(best.adj,10000)):'—'}, half ${best?fmtTime(timeForDist(best.adj,21097)):'—'}.
Lifts (est. 1RM): ${['squat','deadlift','bench','pullup'].map(l=>{const b=bestLift(l);return `${l} ${b?b.e.toFixed(0)+'kg':'—'}`}).join(', ')}

LOAD (last 6 weeks, hours / sessions / run km)
${wks.map(w=>`${w.week}: ${w.hours.toFixed(1)} h, ${w.sessions} sessions, ${w.km.toFixed(0)} km`).join('\n')}
Acute:chronic ${acuteChronic()?.toFixed(2)??'—'}

RECENT SESSIONS
${recent.map(a=>`${a.date} ${a.sport} ${a.km?a.km.toFixed(1)+'km ':''}${fmtTime(a.sec)}${a.hrAvg?' HR'+a.hrAvg:''}`).join('\n')}

CHECK-INS (sleep h / quality / stress / soreness)
${S.checkins.slice(0,7).map(c=>`${c.date}: ${c.sleepH}h, q${c.sleepQ}, stress ${c.stress}, sore ${c.soreness}${c.note?' — '+c.note:''}`).join('\n')||'none'}

DEBRIEFS
${S.debriefs.slice(0,5).map(d=>`${d.date} ${d.session}: RPE ${d.rpe}, ${d.hit}. ${d.notes}`).join('\n')||'none'}

PLANNED THIS WEEK (${week.phase.label}${week.winter?', winter':''})
${allSessions(week).map(s=>`${DAYNAMES[s.dow]} ${s.name} ${s.minutes}min — ${s.body.join(' / ')}`).join('\n')}`;
}
async function askClaude(msg){
  const key=DB.get('apiKey','');
  const hist=DB.get('chat',[]);
  if(!key) throw new Error('No API key. Use "Copy context" and paste it into the Claude app instead.');
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1200,
      system:buildContext(),
      messages:[...hist.slice(-10),{role:'user',content:msg}]})
  });
  if(!r.ok) throw new Error('API '+r.status+'. Check the key, or use Copy context.');
  const d=await r.json();
  return d.content.filter(c=>c.type==='text').map(c=>c.text).join('\n');
}

/* ---------- WIRING ---------------------------------------------- */
function wire(){
  document.querySelectorAll('[data-sess]').forEach(b=>b.onclick=()=>sheetSession(b.dataset.sess));
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{
    const week=buildWeek(mondayOf(b.dataset.day));
    const d=week.days.find(x=>x.main.date===b.dataset.day);
    if(d) sheetSession(sessionKey(d.main));
  });
  const on=(id,fn)=>{const e=el(id); if(e) e.onclick=fn;};
  on('btnWeekPrev',()=>{WEEK_OFFSET--; render();});
  on('btnWeekNext',()=>{WEEK_OFFSET++; render();});
  on('btnWeekToday',()=>{WEEK_OFFSET=0; render();});
  on('btnCheckin',sheetCheckin); on('btnPaces',sheetPaces);
  on('btnLift',sheetLift); on('btnLift2',sheetLift);
  on('btnManual',sheetManual); on('btnDebrief',()=>sheetDebrief(null));
  on('btnPR',sheetPR);
  on('btnExport',exportData); on('btnExport2',exportData);
  on('btnImportJson',importJson);
  on('btnSaveProfile',saveProfile);
  document.querySelectorAll('[data-delpr]').forEach(b=>b.onclick=()=>{
    S.profile.prs.splice(+b.dataset.delpr,1); save('profile'); render();
  });

  const f=el('csvFile');
  if(f) f.onchange=e=>{
    const file=e.target.files[0]; if(!file) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const n=importGarmin(rd.result);
        el('importMsg').innerHTML=`<span class="chip ok">${n} new</span> <span class="mut">${S.activities.length} total</span>`;
        setTimeout(render,900);
      }catch(err){ el('importMsg').innerHTML=`<span class="chip hot">Could not read that file</span> <span class="mut">${esc(err.message)}</span>`; }
    };
    rd.readAsText(file);
  };

  on('btnCopyCtx',async()=>{
    const t=buildContext();
    try{ await navigator.clipboard.writeText(t); el('btnCopyCtx').textContent='Copied'; }
    catch(e){ openSheet(`<h1>Context</h1><textarea style="min-height:50vh">${esc(t)}</textarea>`); }
  });
  on('btnClearChat',()=>{ DB.set('chat',[]); render(); });
  const send=el('chatSend');
  if(send) send.onclick=async()=>{
    const inp=el('chatIn'); const msg=inp.value.trim(); if(!msg) return;
    const hist=DB.get('chat',[]);
    hist.push({role:'user',content:msg}); DB.set('chat',hist);
    inp.value=''; render();
    el('chatLog').insertAdjacentHTML('beforeend','<div class="msg ai" id="pending">thinking…</div>');
    try{
      const a=await askClaude(msg);
      hist.push({role:'assistant',content:a}); DB.set('chat',hist);
    }catch(err){
      hist.push({role:'assistant',content:err.message}); DB.set('chat',hist);
    }
    render();
  };
}
function saveProfile(){
  const g=id=>el(id)?.value;
  const checks=id=>[...document.querySelectorAll(`[data-group="${id}"]:checked`)].map(x=>+x.value);
  Object.assign(S.profile,{
    raceName:g('f_raceName'), raceDate:g('f_raceDate'),
    goalTime:hmsToSec(g('f_goalTime'))||S.profile.goalTime,
    weeklyHours:parseFloat(g('f_weeklyHours'))||7,
    restDay:+g('f_restDay'), qualityDay:+g('f_qualityDay'),
    strengthDays:checks('f_strengthDays'), skiDays:checks('f_skiDays'),
    winterMode:g('f_winterMode'),
    maxHR:+g('f_maxHR')||null, restHR:+g('f_restHR')||null, weightKg:parseFloat(g('f_weightKg'))||null,
    place:g('f_place'), lat:parseFloat(g('f_lat')), lon:parseFloat(g('f_lon'))
  });
  DB.set('apiKey', g('f_apiKey')||'');
  save('profile');
  loadWeather().then(render);
  el('btnSaveProfile').textContent='Saved';
  setTimeout(()=>{TAB='week';render();},600);
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`coach-backup-${iso(today())}.json`; a.click();
}
function importJson(){
  const i=document.createElement('input'); i.type='file'; i.accept='.json';
  i.onchange=e=>{
    const rd=new FileReader();
    rd.onload=()=>{ try{ const d=JSON.parse(rd.result); Object.assign(S,d); saveAll(); render(); }
      catch(err){ alert('That file is not a coach backup.'); } };
    rd.readAsText(e.target.files[0]);
  };
  i.click();
}

/* ---------- 10. BOOT -------------------------------------------- */
document.getElementById('tabs').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  TAB=b.dataset.tab;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  render();
};
render();
loadWeather().then(()=>{ if(TAB==='week') render(); });
</script>
